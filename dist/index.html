<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimi</title>
</head>
<body>
  <div id="content">
    <form id="password-form">
      <label for="username">Username: </label>
      <div>
        <input id="username" form="password-form" autocomplete="off">
      </div>

      <label for="app">Application: </label>
      <div>
        <input id="app" form="password-form" autocomplete="off">
      </div>

      <label for="secret">Secret: </label>
      <div id="secret-field" class="field-container">
        <input id="secret" type="password" form="password-form">
      </div>

      <label for="length">Length: </label>
      <div>
        <input id="length" type="number" form="password-form" value="32">
      </div>

      <button id="generate" type="submit">Generate</button>
    </form>

    <div id="generated" class="field-container">
      <input id="generated-password" type="password" disabled>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
